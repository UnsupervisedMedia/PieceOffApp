[package]
name = "pieceoff-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
pieceoff-core = { path = "../pieceoff-core" }
eframe = { version = "0.32.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
futures-util = "0.3.32"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
rfd = "0.17.2"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.0"
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
cpal = { version = "0.18.2", default-features = false }

[dev-dependencies]
pieceoff-server = { path = "../pieceoff-server" }
