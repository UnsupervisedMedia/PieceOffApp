[package]
name = "pieceoff-web-wasm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pieceoff-core = { path = "../pieceoff-core" }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "=0.2.129"

[dev-dependencies]
# The `ts` feature stays out of the cdylib: dev-dependency features are not
# unified into the release wasm build (resolver 3).
pieceoff-core = { path = "../pieceoff-core", features = ["ts"] }
ts-rs = "=12.0.1"
