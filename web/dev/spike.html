<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>PieceOff renderer spike</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #282b33; overflow: hidden; overscroll-behavior: none; }
      #board { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; }
      #poster { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; z-index: 1; pointer-events: none; opacity: 0.85; }
      #poster[hidden] { display: none; }
      #video { position: fixed; width: 2px; height: 2px; opacity: 0.01; pointer-events: none; left: 0; top: 0; }
      #hud { position: fixed; left: 6px; top: 6px; z-index: 2; font: 12px/1.35 ui-monospace, Menlo, monospace; color: #e8e8e8;
             background: rgba(0, 0, 0, 0.6); padding: 6px 8px; border-radius: 6px; white-space: pre; pointer-events: none; max-width: 96vw; overflow: hidden; }
      #bar { position: fixed; right: 6px; bottom: calc(6px + env(safe-area-inset-bottom)); z-index: 2; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
      #bar button { font: 14px system-ui, sans-serif; padding: 10px 12px; border-radius: 8px; border: 0; background: #e8e8e8; color: #111; }
      #lostmsg { position: fixed; left: 50%; top: 40%; transform: translateX(-50%); z-index: 3; color: #fff; background: #b00; padding: 8px 12px; border-radius: 6px; font: 14px system-ui; }
      #lostmsg[hidden] { display: none; }
    </style>
  </head>
  <body>
    <canvas id="board"></canvas>
    <img id="poster" alt="" hidden />
    <video id="video" muted loop playsinline autoplay preload="auto"></video>
    <div id="hud">loading…</div>
    <div id="lostmsg" hidden>GPU context lost: showing poster, board state kept</div>
    <div id="bar">
      <button id="turn">turn</button>
      <button id="play">pause video</button>
      <button id="bench">bench: off</button>
      <button id="fit">fit</button>
    </div>
    <script type="module" src="./dist/spike.js"></script>
  </body>
</html>
