[workspace]
members = [
    "crates/pieceoff-core",
    "crates/pieceoff-app",
    "crates/pieceoff-server",
    "crates/pieceoff-room-wasm",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.87"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }

# Debug builds hash multi-GB media and decode frames; unoptimized dependencies
# (sha2, image, egui) make that unusably slow.
[profile.dev.package."*"]
opt-level = 3
